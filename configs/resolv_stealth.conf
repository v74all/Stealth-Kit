# ============================================================================
# Stealth Kit — DNS Configuration
# Compatible with Kali Linux / Debian
# ============================================================================
# Copy to /etc/resolv.conf only when the selected profile enables DNS changes.
# Do not make resolv.conf immutable unless you understand your resolver stack.
# ============================================================================

# Primary: localhost (for dnscrypt-proxy, stubby, or Tor DNS)
nameserver 127.0.0.1

# Fallback: Quad9 (privacy-focused, no logging, malware blocking)
nameserver 9.9.9.9
nameserver 149.112.112.112

# DNS options
options edns0
options single-request-reopen
options timeout:2
options attempts:1
