# ============================================================================
# Stealth Kit - Kernel Security Hardening (sysctl)
# Compatible with Kali Linux / Debian
# ============================================================================
# Apply with: sysctl -p /path/to/this/file
# Or copy to: /etc/sysctl.d/99-stealth.conf
# ============================================================================

# ═══════════════════════════════════════════════════════════════════════════
# KERNEL PROTECTION
# ═══════════════════════════════════════════════════════════════════════════

# Restrict access to kernel ring buffer (dmesg)
kernel.dmesg_restrict = 1

# Restrict kernel pointer exposure
kernel.kptr_restrict = 2

# Full ASLR randomization
kernel.randomize_va_space = 2

# Disable Magic SysRq key
kernel.sysrq = 0

# Include PID in core dump filenames
kernel.core_uses_pid = 1

# Restrict access to perf events
kernel.perf_event_paranoid = 3

# Restrict ptrace (process tracing)
kernel.yama.ptrace_scope = 2

# Disable unprivileged BPF
kernel.unprivileged_bpf_disabled = 1

# ═══════════════════════════════════════════════════════════════════════════
# CORE DUMPS — DISABLED
# ═══════════════════════════════════════════════════════════════════════════

# Redirect core dumps to /bin/false (discard)
kernel.core_pattern = |/bin/false

# Prevent setuid programs from dumping core
fs.suid_dumpable = 0

# ═══════════════════════════════════════════════════════════════════════════
# NETWORK - IPv4 DEFENSIVE BASELINE
# ═══════════════════════════════════════════════════════════════════════════

# Ignore ICMP broadcast echo requests
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore bogus ICMP error responses
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Enable reverse path filtering (anti-spoofing)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Disable ICMP redirects (prevents route poisoning)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Disable source routing (prevents source route attacks)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Log suspicious martian packets for defenders
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Enable SYN cookies (anti-SYN flood)
net.ipv4.tcp_syncookies = 1

# Disable TCP timestamps (OS fingerprinting vector)
net.ipv4.tcp_timestamps = 0

# Disable IP forwarding (not a router)
net.ipv4.ip_forward = 0

# Ephemeral port range
net.ipv4.ip_local_port_range = 32768 60999

# ═══════════════════════════════════════════════════════════════════════════
# NETWORK - IPv6
# ═══════════════════════════════════════════════════════════════════════════

# IPv6 is intentionally not disabled by the default workstation baseline.
# Use the kali-lab profile network module when an engagement explicitly needs it.

# ═══════════════════════════════════════════════════════════════════════════
# FILE SYSTEM PROTECTIONS
# ═══════════════════════════════════════════════════════════════════════════

# Protect hardlinks from abuse
fs.protected_hardlinks = 1

# Protect symlinks from abuse
fs.protected_symlinks = 1

# Protect FIFOs
fs.protected_fifos = 2

# Protect regular files
fs.protected_regular = 2
