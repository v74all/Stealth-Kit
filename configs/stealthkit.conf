# Stealth Kit default configuration.
# Profiles in ../profiles override these values.

TOOL_NAME="Stealth Kit"
BRAND="V7LTHRONYX"
AUTHOR="Aiden Azad"
TAGLINE="Authorized Linux Security Audit & Hardening Toolkit"
PROJECT_URL=""

PROFILE="${PROFILE:-workstation-hardening}"

# Safety defaults.
ALLOW_PACKAGE_INSTALL=false
ALLOW_DESTRUCTIVE_CLEAN=false
ALLOW_RESOLV_CONF_IMMUTABLE=false

# Conservative hardening defaults.
ENABLE_SERVICE_HARDENING=true
ENABLE_SERVICE_MASKING=false
ENABLE_SYSCTL_HARDENING=true
ENABLE_USB_AUTOMOUNT_DISABLE=true
ENABLE_CORE_DUMP_RESTRICTION=true
ENABLE_SECURE_UMASK=true
ENABLE_SSH_HARDENING=true
ENABLE_RAM_WIPE=false
ENABLE_AUTO_LOG_CLEAN=false
ENABLE_SHELL_HISTORY_DISABLE=false
ENABLE_KERNEL_MODULE_RESTRICTION=true

# Network defaults.
ENABLE_MAC_SPOOF=false
ENABLE_PERSISTENT_MAC_SPOOF=false
ENABLE_HOSTNAME_RANDOMIZATION=false
ENABLE_FIREWALL=true
ENABLE_IPV6_DISABLE=false
ENABLE_ICMP_DISABLE=false
ENABLE_DNS_PRIVACY=false
ENABLE_TCP_FINGERPRINT_REDUCTION=false
ENABLE_BROADCAST_SUPPRESSION=true
ENABLE_TOR_PROXYCHAINS=false
ENABLE_TOR_DNS=false
